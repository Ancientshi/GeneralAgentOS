name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/ci.yml
  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - name: Verify version matches tag
        run: |
          VERSION=$(PYTHONPATH=src python -c 'from general_agent_os import __version__; print(__version__)')
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - run: python scripts/package_release.py
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "General Agent OS $GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi
  container:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Verify container startup and authentication
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          docker run -d --name gaos-smoke -e OPENAI_API_KEY=test-only -e GAOS_API_KEY=test-only -p 127.0.0.1:17777:7777 "$IMAGE"
          trap 'docker logs gaos-smoke; docker rm -f gaos-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:17777/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:17777/health
          test "$(docker exec gaos-smoke id -u)" = 10001
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:17777/agents)" = 401
          curl -fsS -H 'Authorization: Bearer test-only' http://127.0.0.1:17777/agents
