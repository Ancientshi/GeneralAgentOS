name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[mcp,dev]'
      - run: python -m pip install -e './extensions/benchmarks[mcp,test]'
      - run: python -m pip install -e './extensions/data-science[mcp,test]'
      - if: matrix.python == '3.10'
        run: python -m pip install -e './extensions/data-science[cpu]'
      - run: ruff check src tests
      - run: ruff check extensions/benchmarks
      - run: ruff check extensions/data-science
      - run: pytest -q
      - run: pytest -q extensions/benchmarks/tests
      - run: pytest -q extensions/data-science/tests
      - run: python -m build extensions/data-science
      - run: python -m build
      - run: bash -n install.sh
